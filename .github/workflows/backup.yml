name: Backup privado das cestas
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backup-cestas
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.CESTAS_DATABASE_URL }}
      DJANGO_SECRET_KEY: ${{ secrets.CESTAS_DJANGO_SECRET_KEY }}
      CESTAS_BACKUP_SIGNING_KEY: ${{ secrets.CESTAS_BACKUP_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - id: generate
        run: python scripts/backup_job.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.generate.outputs.ready == 'true'
        with:
          name: cestas-backup-${{ github.run_number }}
          path: backups/backup.json
          if-no-files-found: error
          retention-days: ${{ steps.generate.outputs.retention }}
      - name: Confirmar guarda depois do upload
        if: steps.generate.outputs.ready == 'true'
        run: python manage.py confirmar_backup backups/backup.json --destino 'Artefato privado do agendamento GitHub Actions'
      - name: Registrar falha sem confirmar guarda
        if: failure()
        run: python scripts/report_backup_failure.py
