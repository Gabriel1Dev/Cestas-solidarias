[project]
name = "cestas-solidarias-online"
version = "2.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "reportlab==5.1.0",
  "Django==5.2.19",
  "whitenoise==6.12.0",
  "psycopg[binary]==3.3.8",
  "asgiref==3.13.0",
  "sqlparse==0.6.1",
  "tzdata==2026.6",
  "typing_extensions==4.16.0",
]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python manage.py check --deploy --fail-level ERROR && python manage.py collectstatic --noinput"
